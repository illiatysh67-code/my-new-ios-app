name: Storefront
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  Storefront:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.storefront
        PRODUCT_NAME: Storefront
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Storefront
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"