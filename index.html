<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NewTerm 3">
<meta name="theme-color" content="#1c1c1e">
<title>NewTerm 3 BETA</title>
<link id="icon" rel="apple-touch-icon" href="">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    background: #1c1c1e; color: #e6e6e6;
    font-family: Menlo, "SF Mono", ui-monospace, monospace;
    overflow: hidden;
  }
  #app {
    display: flex; flex-direction: column; height: 100%;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #status {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    height: 54px; padding: env(safe-area-inset-top, 0px) 28px 0 40px; box-sizing: content-box;
    background: #1c1c1e; font: 600 16px -apple-system, system-ui, sans-serif; color: #fff;
  }
  #status .icons { display: flex; align-items: center; gap: 6px; }
  header {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    height: 44px; padding: 0 16px;
    background: #1c1c1e; border-bottom: 1px solid #000;
  }
  header .title {
    flex: 1; text-align: center;
    font: 600 17px -apple-system, system-ui, sans-serif; color: #fff;
  }
  header .controls { display: flex; gap: 18px; align-items: center; width: 84px; justify-content: flex-end; }
  header svg { display: block; }
  #tab {
    flex-shrink: 0; height: 30px; line-height: 30px;
    padding: 0 14px; font: 500 13px -apple-system, system-ui, sans-serif;
    background: #2c2c2e; color: #ddd; width: fit-content;
  }
  #out {
    flex: 1; overflow-y: auto; padding: 8px;
    font-size: 13px; line-height: 1.35;
    -webkit-overflow-scrolling: touch;
  }
  .line { min-height: 1.35em; white-space: pre-wrap; word-break: break-word; }
  #row { display: flex; padding: 0 8px 10px; align-items: baseline; }
  #ps { white-space: nowrap; }
  #in {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
    color: #e6e6e6; font: inherit; padding: 0; margin: 0;
    caret-color: #f5c518;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="controls" style="width:auto">
      <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="8" cy="8" r="5" fill="none" stroke="#0a84ff" stroke-width="2.4"/><path d="M11.5 11.5 L21 21 M17 17 L19 15 M19.5 19.5 L21.5 17.5" stroke="#0a84ff" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
    </div>
    <div class="title">Terminal</div>
    <div class="controls">
      <svg width="22" height="22" viewBox="0 0 24 24"><g fill="none" stroke="#0a84ff" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5l2.2 1.6 2.7-.3 1 2.5 2.4 1.3-.3 2.7 1.3 2.2-1.6 2.2.3 2.7-2.5 1-1.3 2.4-2.7-.3L12 21.5l-2.2-1.6-2.7.3-1-2.5-2.4-1.3.3-2.7L2.7 11.5l1.6-2.2-.3-2.7 2.5-1 1.3-2.4 2.7.3z"/><circle cx="12" cy="12" r="3.2"/></g></svg>
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#0a84ff" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
  </header>
  <div id="tab">iPhone:~ mobile%</div>
  <div id="row">
    <span id="ps"></span>
    <input id="in" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
  </div>
  <div id="out"></div>
</div>

<script>
  const out = document.getElementById('out');
  const inp = document.getElementById('in');
  const ps  = document.getElementById('ps');
  const PROMPT = 'iPhone:~ mobile% ';
  ps.textContent = PROMPT;

  function print(text) {
    const d = document.createElement('div');
    d.className = 'line';
    d.textContent = text;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
  }

  function printBlock(text) {
    text.split('\n').forEach(print);
  }

  printBlock(
    'Last login: ' + new Date(Date.now() - 3600e3).toString().slice(0, 24) + ' on ttys001\n' +
    'Type a command.'
  );

  const logo = [
    '            .:\'',
    '         __ :\'__',
    '      .\'`  `-\'  ``.',
    '     :            .\'',
    '     :           :',
    '      :         `-;',
    '       `.__.-.__.\''
  ];

  const info = [
    'mobile@iPhone',
    '--------------',
    'OS: iOS 27.0 arm64',
    'Host: iPhone 12',
    'Kernel: Darwin 27.0.0',
    'Uptime: 4 days, 2 hours',
    'Shell: zsh 5.9',
    'Terminal: NewTerm 3 BETA',
    'CPU: Apple A14 Bionic (6) @ 3.10 GHz',
    'Memory: 2.31 GiB / 4.00 GiB'
  ];

  function fastfetch() {
    const width = 30;
    const lines = Math.max(logo.length, info.length);
    let block = '';
    for (let i = 0; i < lines; i++) {
      const l = (logo[i] || '').padEnd(width, ' ');
      const r = info[i] || '';
      block += l + r + '\n';
    }
    printBlock(block.replace(/\n$/, ''));
  }

  function run(raw) {
    const cmd = raw.trim();
    print(PROMPT + raw);
    if (cmd === '') return;

    const name = cmd.split(/\s+/)[0];
    if (name === 'fastfetch') {
      fastfetch();
    } else {
      print('zsh: command not found: ' + name);
    }
  }

  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      run(inp.value);
      inp.value = '';
      out.scrollTop = out.scrollHeight;
    }
  });

  document.addEventListener('click', () => inp.focus());
  inp.focus();

  // Home-screen icon: black tile, >_ and yellow BETA pill
  (function makeIcon() {
    const S = 180;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const x = c.getContext('2d');

    x.fillStyle = '#000';
    x.fillRect(0, 0, S, S);

    x.fillStyle = '#fff';
    x.font = '600 64px Menlo, monospace';
    x.textBaseline = 'alphabetic';
    x.fillText('>_', 24, 84);

    const px = 62, py = 108, pw = 100, ph = 40, r = 20;
    x.fillStyle = '#f5c518';
    x.beginPath();
    x.moveTo(px + r, py);
    x.arcTo(px + pw, py, px + pw, py + ph, r);
    x.arcTo(px + pw, py + ph, px, py + ph, r);
    x.arcTo(px, py + ph, px, py, r);
    x.arcTo(px, py, px + pw, py, r);
    x.closePath();
    x.fill();

    x.fillStyle = '#000';
    x.font = '700 22px -apple-system, Helvetica, Arial, sans-serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('BETA', px + pw / 2, py + ph / 2 + 1);

    document.getElementById('icon').href = c.toDataURL('image/png');
  })();
</script>
</body>
</html>
