name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: >-
          xcodebuild
          -project Storefront.xcodeproj
          -scheme Storefront
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Storefront.app"
          test -d "$APP_PATH"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Storefront-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Storefront-unsigned-ipa
          path: Storefront-unsigned.ipa
          if-no-files-found: error