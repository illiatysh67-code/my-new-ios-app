name: Build iTools

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew update --quiet
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: >-
          xcodebuild
          -project iTools.xcodeproj
          -scheme iTools
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/iTools.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload iTools-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: iTools-unsigned-ipa
          path: iTools-unsigned.ipa
          if-no-files-found: error
